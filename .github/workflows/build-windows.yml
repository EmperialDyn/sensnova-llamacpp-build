name: Build SenseNova llama.cpp (Windows RTX 30 Vulkan + Web UI)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or commit in yudhanjaya/llama.cpp'
        required: true
        default: 'sensenova-mhc-fused'

jobs:
  build-windows-vulkan:
    runs-on: windows-latest
    steps:
      - name: Checkout yudhanjaya/llama.cpp
        uses: actions/checkout@v4
        with:
          repository: yudhanjaya/llama.cpp
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js for Web UI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web UI from Source
        shell: pwsh
        run: |
          $uiCandidates = @(
            "ui/apps/chat",
            "ui",
            "tools/server/webui",
            "tools/webui"
          )
          $uiDir = $uiCandidates | Where-Object { Test-Path (Join-Path $_ "package.json") } | Select-Object -First 1

          if ($uiDir) {
            Write-Host "Building Web UI in $uiDir"
            Push-Location $uiDir
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }

            npm run build
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Full npm run build failed; falling back to vite build."
              npx vite build
              if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }
            }
            Pop-Location
          } else {
            Write-Warning "No Web UI package.json found; CMake will still compile llama-server without prebuilt UI download."
          }

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $sdkDir = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $sdkDir) {
            Write-Error "Vulkan SDK directory not found under C:\VulkanSDK after installation."
            exit 1
          }

          Write-Host "Installed Vulkan SDK at: $sdkDir"
          "VULKAN_SDK=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdkDir\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure CMake (Ninja + MSVC 14.44 + Vulkan)
        shell: pwsh
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }

          $msvcDir = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207"
          $clExe = "$msvcDir\bin\Hostx64\x64\cl.exe"

          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress | Out-Null
          }

          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10"
          $sdkIncRoot = "$sdkRoot\Include"
          $sdkLibRoot = "$sdkRoot\Lib"
          $latestSdkVer = Get-ChildItem $sdkIncRoot -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty Name

          $includes = @(
            "$msvcDir\include",
            "$msvcDir\ATLMFC\include"
          )
          $libs = @(
            "$msvcDir\lib\x64",
            "$msvcDir\ATLMFC\lib\x64"
          )
          $binPaths = @(
            "$msvcDir\bin\Hostx64\x64"
          )

          if ($env:VULKAN_SDK) {
            $includes += "$env:VULKAN_SDK\Include"
            $libs += "$env:VULKAN_SDK\Lib"
            $binPaths += "$env:VULKAN_SDK\Bin"
          }

          if ($latestSdkVer) {
            Write-Host "Using Windows SDK: $latestSdkVer"
            $includes += @(
              "$sdkIncRoot\$latestSdkVer\ucrt",
              "$sdkIncRoot\$latestSdkVer\shared",
              "$sdkIncRoot\$latestSdkVer\um",
              "$sdkIncRoot\$latestSdkVer\winrt"
            )
            $libs += @(
              "$sdkLibRoot\$latestSdkVer\ucrt\x64",
              "$sdkLibRoot\$latestSdkVer\um\x64"
            )
            if (Test-Path "$sdkRoot\bin\$latestSdkVer\x64") {
              $binPaths += "$sdkRoot\bin\$latestSdkVer\x64"
            }
          }

          $includeVal = ($includes | Where-Object { Test-Path $_ }) -join ";"
          $libVal = ($libs | Where-Object { Test-Path $_ }) -join ";"
          $pathVal = ($binPaths | Where-Object { Test-Path $_ }) -join ";"

          $env:INCLUDE = $includeVal
          $env:LIB = $libVal
          $env:PATH = "$pathVal;$env:PATH"

          "INCLUDE=$includeVal" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIB=$libVal" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$pathVal" | Out-File -FilePath $env:GITHUB_PATH -Append

          cmake -G Ninja -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$clExe" `
            -DCMAKE_CXX_COMPILER="$clExe" `
            -DGGML_VULKAN=ON `
            -DLLAMA_USE_PREBUILT_UI=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Binaries and DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          $builtExes = Get-ChildItem -Path "build" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
          $builtDlls = Get-ChildItem -Path "build" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue

          Write-Host "Found $($builtExes.Count) .exe files and $($builtDlls.Count) .dll files under build/"
          $builtExes | ForEach-Object { Write-Host "EXE: $($_.FullName)" }
          $builtDlls | ForEach-Object { Write-Host "DLL: $($_.FullName)" }

          $builtExes | Copy-Item -Destination dist/ -Force
          $builtDlls | Copy-Item -Destination dist/ -Force

          if (-not (Get-ChildItem -Path "dist" -File -ErrorAction SilentlyContinue)) {
            Write-Error "No binaries were copied into dist/."
            exit 1
          }

      - name: Upload Windows Vulkan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-sensenova-win64-vulkan-rtx30-webui
          path: dist/
          retention-days: 7
