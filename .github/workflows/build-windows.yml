name: Build SenseNova llama.cpp (Windows RTX 30 CUDA + Web UI)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or commit in yudhanjaya/llama.cpp'
        required: true
        default: 'sensenova-mhc-fused'
      cuda_version:
        description: 'CUDA Toolkit version to install on runner'
        required: true
        default: '13.2.0'

jobs:
  build-windows-cuda:
    runs-on: windows-latest
    steps:
      - name: Checkout yudhanjaya/llama.cpp
        uses: actions/checkout@v4
        with:
          repository: yudhanjaya/llama.cpp
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js for Web UI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web UI from Source
        shell: pwsh
        run: |
          $uiCandidates = @(
            "ui/apps/chat",
            "ui",
            "tools/server/webui",
            "tools/webui"
          )
          $uiDir = $uiCandidates | Where-Object { Test-Path (Join-Path $_ "package.json") } | Select-Object -First 1

          if ($uiDir) {
            Write-Host "Building Web UI in $uiDir"
            Push-Location $uiDir
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }

            npm run build
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Full npm run build failed (likely PWA asset generator); falling back to vite build."
              npx vite build
              if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }
            }
            Pop-Location
          } else {
            Write-Warning "No Web UI package.json found; CMake will still compile llama-server without prebuilt UI download."
          }

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ github.event.inputs.cuda_version }}

      - name: Configure CMake (Ninja + MSVC 14.44 + CUDA sm_86)
        shell: pwsh
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }

          $msvcDir = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207"
          $clExe = "$msvcDir\bin\Hostx64\x64\cl.exe"
          $nvccExe = "$env:CUDA_PATH\bin\nvcc.exe"

          # Enter VS developer environment for MSVC 14.44 so Ninja has INCLUDE/LIB paths
          $devCmd = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\VsDevCmd.bat"
          $envVars = cmd /s /c "`"$devCmd`" -arch=x64 -host_arch=x64 -vcvars_ver=14.44.35207 && set"
          foreach ($line in $envVars) {
            if ($line -match '^([^=]+)=(.*)$') {
              [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }

          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress | Out-Null
          }

          cmake -G Ninja -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$clExe" `
            -DCMAKE_CXX_COMPILER="$clExe" `
            -DCMAKE_CUDA_COMPILER="$nvccExe" `
            -DCMAKE_CUDA_HOST_COMPILER="$clExe" `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES=86 `
            -DLLAMA_USE_PREBUILT_UI=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release Binaries
        shell: pwsh
        run: |
          cmake --build build --config Release -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Binaries and DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build/bin/Release/*.exe dist/
          Copy-Item build/bin/Release/*.dll dist/
          if ($env:CUDA_PATH -and (Test-Path "$env:CUDA_PATH\bin")) {
            Get-ChildItem "$env:CUDA_PATH\bin" -Filter "cudart64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination dist/
            Get-ChildItem "$env:CUDA_PATH\bin" -Filter "cublas64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination dist/
            Get-ChildItem "$env:CUDA_PATH\bin" -Filter "cublasLt64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination dist/
          }

      - name: Upload Windows CUDA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-sensenova-win64-cuda-rtx30-webui
          path: dist/
          retention-days: 7
